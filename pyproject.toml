[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resurrect"
version = "0.1.0"
description = "Bring abandoned open-source projects back to life with a local LLM."
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resurrect = "resurrect.cli:app"

[tool.setuptools]
packages = ["resurrect"]